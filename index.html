<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>js-quiz — JavaScript Practice</title>
<meta name="description" content="534 multiple-choice questions across 89 JavaScript topics. Practice by topic, by part, or with a random mix.">
<meta name="theme-color" content="#f6f7fb">
<style>
:root{
  --bg:#f6f7fb;
  --bg-2:#eef0f6;
  --surface:#ffffff;
  --surface-2:#f2f4f9;
  --surface-hover:#e9ecf5;
  --border:#dde1ec;
  --text:#1a2033;
  --text-dim:#5b6480;
  --text-faint:#9aa2ba;
  --accent:#f0c419;
  --accent-ink:#2a2205;
  --violet:#7c5cf0;
  --good:#16a34a;
  --good-bg:rgba(22,163,74,.12);
  --good-ink:#0a3320;
  --bad:#dc2626;
  --bad-bg:rgba(220,38,38,.10);
  --bad-ink:#4a0d0d;
  --r-sm:10px;
  --r-md:16px;
  --r-lg:22px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code","Fira Code",Consolas,Menlo,monospace;
  --sat:env(safe-area-inset-top);
  --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;}
html{background:var(--bg-2);}
body{
  margin:0;
  min-height:100dvh;
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(240,196,25,.10), transparent 60%),
    radial-gradient(700px 500px at 110% 10%, rgba(124,92,240,.08), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-ui);
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font-family:inherit;}
#app{
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:640px;
  margin:0 auto;
  padding-bottom:calc(24px + var(--sab));
}
a{color:inherit;}

/* focus visibility */
button:focus-visible, input:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}
button{-webkit-tap-highlight-color:transparent;}

/* ---------- header (shared) ---------- */
.topbar{
  position:sticky; top:0; z-index:5;
  padding:calc(14px + var(--sat)) 20px 12px;
  background:linear-gradient(var(--bg-2) 60%, transparent);
  backdrop-filter:blur(6px);
  display:flex; align-items:center; gap:10px;
}
.brand{
  display:flex; align-items:baseline; gap:2px;
  font-family:var(--font-mono);
  font-size:15px; font-weight:600; color:var(--text-dim);
  letter-spacing:.2px;
}
.brand b{color:var(--accent); font-weight:700;}
.cursor{
  display:inline-block; width:8px; height:16px; margin-left:3px;
  background:var(--accent); animation:blink 1.1s steps(1) infinite; vertical-align:-3px;
}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
@media (prefers-reduced-motion:reduce){ .cursor{animation:none;opacity:1;} }

.icon-btn{
  appearance:none; border:1px solid var(--border); background:var(--surface);
  color:var(--text-dim); width:38px; height:38px; border-radius:var(--r-sm);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.icon-btn:hover{background:var(--surface-hover); color:var(--text);}
.icon-btn svg{width:18px;height:18px;}

/* ---------- HOME ---------- */
.hero{ padding:6px 20px 18px; }
.hero h1{
  font-size:clamp(26px,7vw,34px);
  line-height:1.15; margin:6px 0 6px;
  letter-spacing:-.02em;
}
.hero p{ margin:0; color:var(--text-dim); font-size:15px; line-height:1.5; max-width:46ch; }
.stat-row{ display:flex; gap:18px; margin-top:16px; flex-wrap:wrap; }
.stat{ display:flex; flex-direction:column; }
.stat b{ font-size:20px; font-family:var(--font-mono); }
.stat span{ font-size:12px; color:var(--text-faint); }

.search-wrap{ padding:0 20px 6px; }
.search-box{
  display:flex; align-items:center; gap:10px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:12px 14px;
}
.search-box svg{ width:17px;height:17px; color:var(--text-faint); flex:none; }
.search-box input{
  border:0; background:transparent; color:var(--text); font-size:15px; width:100%;
  outline:none;
}
.search-box input::placeholder{ color:var(--text-faint); }

.section{ padding:22px 20px 4px; }
.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
.section-head h2{ font-size:13px; text-transform:none; letter-spacing:.01em; color:var(--text-dim); font-weight:600; margin:0; }

.chip-row{ display:flex; gap:10px; flex-wrap:wrap; }
.chip{
  appearance:none; cursor:pointer; border:1px solid var(--border); background:var(--surface);
  color:var(--text); padding:11px 16px; border-radius:999px; font-size:14px; font-weight:600;
  display:flex; align-items:center; gap:8px; transition:transform .12s ease, background .15s ease, border-color .15s ease;
}
.chip:hover{ background:var(--surface-hover); border-color:var(--violet); }
.chip:active{ transform:scale(.97); }
.chip .n{ font-family:var(--font-mono); color:var(--accent); }

.part{
  border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:10px; overflow:hidden;
  background:var(--surface);
}
.part-head{
  width:100%; display:flex; align-items:center; gap:12px; padding:14px 14px;
  background:transparent; border:0; cursor:pointer; text-align:left; color:var(--text);
}
.part-head:hover{ background:var(--surface-hover); }
.part-num{
  font-family:var(--font-mono); font-size:12px; color:var(--bg); background:var(--violet);
  min-width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center;
  flex:none; font-weight:700;
}
.part-title{ flex:1; font-size:14.5px; font-weight:600; }
.part-meta{ font-size:12px; color:var(--text-faint); font-family:var(--font-mono); flex:none; }
.chev{ width:16px; height:16px; color:var(--text-faint); flex:none; transition:transform .18s ease; }
.part.open .chev{ transform:rotate(180deg); }
.part-topics{ display:none; padding:2px 10px 10px; }
.part.open .part-topics{ display:block; }
.part-quiz-all{
  margin:0 10px 10px; width:calc(100% - 20px);
  border:1px dashed var(--border); background:transparent; color:var(--text-dim);
  padding:10px 12px; border-radius:var(--r-sm); font-size:13px; cursor:pointer; text-align:center;
  transition:border-color .15s ease, color .15s ease;
}
.part-quiz-all:hover{ border-color:var(--accent); color:var(--accent); }

.topic-row{
  width:100%; display:flex; align-items:center; gap:10px; padding:10px 8px;
  background:transparent; border:0; border-top:1px solid var(--border); color:var(--text);
  cursor:pointer; text-align:left; border-radius:var(--r-sm);
}
.topic-row:first-child{ border-top:0; }
.topic-row:hover{ background:var(--surface-hover); }
.topic-num{ font-family:var(--font-mono); font-size:11.5px; color:var(--text-faint); min-width:22px; }
.topic-name{ flex:1; font-size:14px; }
.topic-qcount{ font-size:11px; color:var(--text-faint); font-family:var(--font-mono); background:var(--bg-2); padding:2px 7px; border-radius:999px; flex:none;}

.hidden{ display:none !important; }

/* ---------- QUIZ ---------- */
.quiz-meta{ padding:2px 20px 10px; display:flex; flex-direction:column; gap:10px; }
.quiz-crumb{ font-size:12.5px; color:var(--text-dim); display:flex; justify-content:space-between; gap:10px; }
.quiz-crumb .score{ font-family:var(--font-mono); color:var(--accent-ink); background:var(--accent); padding:1px 8px; border-radius:999px; font-weight:700; }
.quiz-crumb .timer{ font-family:var(--font-mono); color:var(--text-dim); font-weight:600; }
.quiz-crumb .timer.low{ color:var(--bad); font-weight:800; }
.progress-track{ height:6px; background:var(--surface); border-radius:999px; overflow:hidden; }
.progress-fill{ height:100%; background:linear-gradient(90deg, var(--violet), var(--accent)); border-radius:999px; transition:width .35s ease; }
@media (prefers-reduced-motion:reduce){ .progress-fill{ transition:none; } }
.q-count{ font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); }

.q-wrap{ padding:8px 20px 20px; flex:1; }
.q-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:20px; margin-bottom:16px;
}
.q-prompt{ font-size:18px; line-height:1.5; font-weight:600; letter-spacing:-.01em; }
.q-prompt code{
  font-family:var(--font-mono); font-size:.86em; background:var(--bg-2); color:var(--accent);
  padding:1px 6px; border-radius:6px; border:1px solid var(--border);
}

.options{ display:flex; flex-direction:column; gap:10px; }
.option{
  display:flex; align-items:center; gap:12px; width:100%;
  background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r-md);
  padding:14px 14px; cursor:pointer; text-align:left; color:var(--text);
  font-size:15px; line-height:1.4; transition:border-color .15s ease, background .15s ease, transform .1s ease;
  min-height:52px;
}
.option code{ font-family:var(--font-mono); font-size:.88em; background:var(--bg-2); padding:1px 5px; border-radius:5px; }
.option:hover:not([disabled]){ border-color:var(--violet); background:var(--surface-hover); }
.option:active:not([disabled]){ transform:scale(.99); }
.option .letter{
  font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--text-dim);
  background:var(--bg-2); border:1px solid var(--border); width:28px; height:28px; border-radius:8px;
  display:flex; align-items:center; justify-content:center; flex:none;
}
.option[disabled]{ cursor:default; }
.option.is-correct{ border-color:var(--good); background:var(--good-bg); }
.option.is-correct .letter{ background:var(--good); color:var(--good-ink); border-color:var(--good); }
.option.is-wrong{ border-color:var(--bad); background:var(--bad-bg); }
.option.is-wrong .letter{ background:var(--bad); color:#fff; border-color:var(--bad); }
.option.is-muted{ opacity:.5; }
.option .mark{ margin-left:auto; font-size:16px; flex:none; }

.feedback-bar{
  position:sticky; bottom:0; z-index:4;
  padding:14px 20px calc(14px + var(--sab));
  background:linear-gradient(0deg, var(--bg) 55%, transparent);
  display:flex; align-items:center; gap:12px;
  transform:translateY(8px); opacity:0; pointer-events:none;
  transition:transform .2s ease, opacity .2s ease;
}
.feedback-bar.show{ transform:translateY(0); opacity:1; pointer-events:auto; }
@media (prefers-reduced-motion:reduce){ .feedback-bar{ transition:none; } }
.feedback-text{ flex:1; font-size:14.5px; font-weight:600; }
.feedback-text.good{ color:var(--good); }
.feedback-text.bad{ color:var(--bad); }
.feedback-text small{ display:block; font-weight:400; color:var(--text-dim); font-size:12.5px; margin-top:2px; }

.btn{
  appearance:none; border:0; cursor:pointer; border-radius:var(--r-md);
  padding:13px 20px; font-size:15px; font-weight:700; font-family:inherit;
  transition:transform .1s ease, opacity .15s ease;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }
.btn-ghost{ background:var(--surface); color:var(--text); border:1px solid var(--border); }
.btn-block{ width:100%; }

/* ---------- RESULTS ---------- */
.results-wrap{ padding:10px 20px 24px; flex:1; }
.score-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:28px 22px; text-align:center; margin-bottom:20px;
}
.score-big{ font-family:var(--font-mono); font-size:44px; font-weight:700; letter-spacing:-.02em; }
.score-pct{ color:var(--accent); }
.score-label{ color:var(--text-dim); font-size:13px; margin-top:2px; }
.score-msg{ font-size:16px; font-weight:600; margin-top:16px; }
.score-sub{ color:var(--text-dim); font-size:13.5px; margin-top:4px; }
.results-actions{ display:flex; gap:10px; margin-bottom:22px; }

.review{ display:flex; flex-direction:column; gap:8px; }
.review-item{
  display:flex; gap:10px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--r-md);
  background:var(--surface); font-size:13.5px; align-items:flex-start;
}
.review-item .mk{ flex:none; font-size:15px; line-height:1.4; }
.review-item .body{ flex:1; }
.review-item .prompt{ color:var(--text); line-height:1.45; }
.review-item .prompt code{ font-family:var(--font-mono); font-size:.88em; background:var(--bg-2); padding:0 4px; border-radius:4px; }
.review-item .ans{ margin-top:6px; color:var(--text-dim); font-size:12.5px; }
.review-item .ans b.good{ color:var(--good); }
.review-item.correct{ opacity:.65; }

.empty{ padding:40px 20px; text-align:center; color:var(--text-faint); font-size:14px; }

/* ---------- STUDENT INFO / ADMIN FORMS ---------- */
.form-wrap{ padding:10px 20px 24px; flex:1; display:flex; flex-direction:column; gap:14px; }
.form-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:22px; display:flex; flex-direction:column; gap:14px;
}
.form-card h2{ margin:0; font-size:18px; }
.form-card p.sub{ margin:0; color:var(--text-dim); font-size:13px; line-height:1.5; }
.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:12.5px; color:var(--text-dim); font-weight:600; }
.field input{
  background:var(--bg-2); border:1px solid var(--border); border-radius:var(--r-sm);
  color:var(--text); padding:12px 14px; font-size:15px; outline:none; font-family:inherit;
  width:100%;
}
.field input:focus{ border-color:var(--violet); }
.form-error{ color:var(--bad); font-size:13px; min-height:1px; }
.spacer{ flex:1; }
.link-btn{
  appearance:none; border:0; background:transparent; color:var(--text-dim); font-size:12.5px;
  cursor:pointer; text-decoration:underline; padding:0; font-family:inherit;
}
.link-btn:hover{ color:var(--text); }

/* ---------- ADMIN DASHBOARD ---------- */
.badge{
  font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:.03em;
  padding:3px 10px; border-radius:999px; display:inline-block;
}
.badge.pass{ background:var(--good-bg); color:var(--good); }
.badge.fail{ background:var(--bad-bg); color:var(--bad); }
.admin-row{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
  padding:12px 14px; margin-bottom:8px;
}
.admin-row .top{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.admin-row .name{ font-weight:700; font-size:14.5px; }
.admin-row .meta{ font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono); margin-top:4px; }
.admin-row .quiz{ font-size:13px; color:var(--text-dim); margin-top:4px; }

</style>
</head>
<body>
<div id="app"></div>
<script>
var QUIZ_DATA = [{"title":"Part 1 — JavaScript Basics","topics":[{"num":1,"title":"Alerts","questions":[{"prompt":"What does calling <code>alert(\"Hi\")</code> do in a browser?","options":["Logs \"Hi\" to the console only","Shows a popup box with \"Hi\" and an OK button","Sends \"Hi\" to the server","Opens a new tab titled \"Hi\""],"correct":1},{"prompt":"While an alert box is open, the rest of the page's JavaScript:","options":["Keeps running normally","Pauses until the box is closed","Restarts from the top","Throws an error"],"correct":1},{"prompt":"Which line correctly displays an alert box?","options":["alert \"Hello\";","Alert(\"Hello\");","alert(\"Hello\");","show alert(\"Hello\");"],"correct":2},{"prompt":"What does <code>alert(2 + 2)</code> display?","options":["\"2 + 2\"","4","NaN","undefined"],"correct":1},{"prompt":"alert() is best suited for:","options":["Storing data permanently","Quick messages and simple debugging","Styling elements","Making network requests"],"correct":1},{"prompt":"Which object does the alert() function technically belong to?","options":["document","window","console","array"],"correct":1}]},{"num":2,"title":"Variables for Strings","questions":[{"prompt":"Which correctly creates a string variable?","options":["let name = Fazal K;","let name = \"Fazal K\";","let name == \"Fazal K\";","string name = \"Fazal K\";"],"correct":1},{"prompt":"If firstName is \"Fazal K\", what does <code>alert(\"Hello, \" + firstName)</code> show?","options":["\"Hello, firstName\"","\"Hello, Fazal K\"","An error","undefined"],"correct":1},{"prompt":"Which of these is NOT a valid way to write a string?","options":["'Hello'","\"Hello\"","`Hello`","*Hello*"],"correct":3},{"prompt":"Which keyword is recommended for a variable that may be reassigned later?","options":["var","let","const","string"],"correct":1},{"prompt":"What is the type of the value in <code>let city = \"Boston\";</code>?","options":["number","boolean","string","object"],"correct":2},{"prompt":"Which statement about strings is true?","options":["Must always use double quotes","Can use single, double, or backtick quotes","Cannot contain spaces","Are the same as numbers"],"correct":1}]},{"num":3,"title":"Variables for Numbers","questions":[{"prompt":"Which is correctly written as a number variable?","options":["let age = \"25\";","let age = 25;","let age = (25);","let age == 25;"],"correct":1},{"prompt":"What does <code>let total = 10 * 2;</code> store in total?","options":["\"10*2\"","20","\"20\"","undefined"],"correct":1},{"prompt":"Number values in JavaScript:","options":["Must be wrapped in quotes","Are written without quotes","Cannot be decimals","Cannot be negative"],"correct":1},{"prompt":"What is the result of <code>typeof 19.99</code>?","options":["\"string\"","\"number\"","\"decimal\"","\"float\""],"correct":1},{"prompt":"Which variable correctly stores a decimal price?","options":["let price = 19,99;","let price = \"19.99\";","let price = 19.99;","let price = 19.99f;"],"correct":2},{"prompt":"What does <code>alert(5 + 5);</code> display?","options":["\"55\"","10","\"5 + 5\"","NaN"],"correct":1}]},{"num":4,"title":"Variable Names: Legal and Illegal","questions":[{"prompt":"Which variable name is illegal?","options":["userName","_score","2fast","$total"],"correct":2},{"prompt":"Which rule about variable names is TRUE?","options":["Can start with a digit","Are case-sensitive","Can contain hyphens","Can be reserved words"],"correct":1},{"prompt":"Which of these is a legal variable name?","options":["my-name","my name","myName","1myName"],"correct":2},{"prompt":"Why is <code>let class = \"A\";</code> illegal?","options":["\"class\" starts lowercase","\"class\" is a reserved word","It's missing quotes","It's too short"],"correct":1},{"prompt":"Are <code>userName</code> and <code>username</code> the same variable?","options":["Yes, always","No, names are case-sensitive","Only inside functions","Only with var"],"correct":1},{"prompt":"Which characters are allowed anywhere in a variable name?","options":["Letters, digits, underscore, $","Letters and spaces only","Any punctuation","Only lowercase letters"],"correct":0}]},{"num":5,"title":"Math Expressions: Familiar Operators","questions":[{"prompt":"What does <code>10 - 3</code> evaluate to?","options":["13","7","30","3.33"],"correct":1},{"prompt":"Which operator is used for multiplication?","options":["x","*","^","&amp;"],"correct":1},{"prompt":"What does <code>10 / 3</code> display?","options":["3","3.3333333333333335","13","7"],"correct":1},{"prompt":"What is the result of <code>4 + 4 * 2</code>?","options":["16","12","10","8"],"correct":1},{"prompt":"Which of these has lower precedence than * and /?","options":["*","/","+","They're all equal"],"correct":2},{"prompt":"What does <code>alert(2 * 3 + 4);</code> display?","options":["14","10","24","9"],"correct":1}]},{"num":6,"title":"Math Expressions: Unfamiliar Operators","questions":[{"prompt":"What does <code>7 % 2</code> evaluate to?","options":["3.5","1","0","14"],"correct":1},{"prompt":"What does <code>2 ** 3</code> evaluate to?","options":["5","6","8","9"],"correct":2},{"prompt":"After <code>let n = 5; n++;</code>, what is n?","options":["5","6","4","55"],"correct":1},{"prompt":"If score was 10, what does <code>score += 5;</code> do?","options":["Sets score to 5","Sets score to 15","Compares score to 5","Causes an error"],"correct":1},{"prompt":"The modulus operator (%) is most useful for:","options":["Rounding numbers","Finding a remainder (e.g. odd/even)","Converting strings to numbers","Comparing two strings"],"correct":1},{"prompt":"What does <code>10 % 3</code> evaluate to?","options":["3","1","3.33","0"],"correct":1}]},{"num":7,"title":"Math Expressions: Eliminating Ambiguity","questions":[{"prompt":"What does <code>2 + 3 * 4</code> evaluate to?","options":["20","14","24","9"],"correct":1},{"prompt":"What does <code>(2 + 3) * 4</code> evaluate to?","options":["20","14","9","24"],"correct":0},{"prompt":"Why use parentheses in a math expression?","options":["They make code run faster","They force a specific order of operations","They're required by JS syntax","They convert numbers to strings"],"correct":1},{"prompt":"What does <code>(10 - 4) * 2 + 6 / 3</code> evaluate to?","options":["14","12","18","8"],"correct":0},{"prompt":"Without parentheses, which happen before addition/subtraction?","options":["Nothing, all equal","Multiplication and division","Only division","Only exponents"],"correct":1},{"prompt":"What does <code>20 / (2 + 2)</code> evaluate to?","options":["12","5","22","10"],"correct":1}]},{"num":8,"title":"Concatenating Text Strings","questions":[{"prompt":"What does <code>\"Hello, \" + \"World!\"</code> evaluate to?","options":["\"Hello, World!\"","\"Hello,World!\"","An error","NaN"],"correct":0},{"prompt":"What does <code>\"5\" + 5</code> evaluate to?","options":["10","\"55\"","\"10\"","An error"],"correct":1},{"prompt":"Which of these is a template literal?","options":["\"Hello ${name}\"","'Hello ${name}'","`Hello ${name}`","(Hello ${name})"],"correct":2},{"prompt":"What does <code>`${2 + 2} apples`</code> evaluate to?","options":["\"2 + 2 apples\"","\"4 apples\"","An error","\"${2+2} apples\""],"correct":1},{"prompt":"Concatenation refers to:","options":["Comparing two values","Joining strings together","Rounding a number","Looping through an array"],"correct":1},{"prompt":"What symbol is used for basic string concatenation?","options":["&amp;","+",".",","],"correct":1}]},{"num":9,"title":"Prompts","questions":[{"prompt":"What does <code>prompt(\"Your name?\")</code> return if the user types \"Fazal K\" and clicks OK?","options":["The number 0","The string \"Fazal K\"","undefined","true"],"correct":1},{"prompt":"What does prompt() return if the user clicks Cancel?","options":["An empty string always","null","The word \"Cancel\"","0"],"correct":1},{"prompt":"Which statement about prompt() is TRUE?","options":["Returns a number if digits are typed","Al .href = \"example.com\";","document.url(\"example.com\");","location.title = \"example.com\";"],"correct":0},{"prompt":"Is window.location.href the simplest way to redirect with JavaScript?","options":["No, it's rarely used","Yes, it's the simplest common approach","It can only be read, never set","It only works on HTTPS pages"],"correct":1},{"prompt":"Can a button's click event trigger a redirect using location.href?","options":["No","Yes, inside the click handler","Only with a form","Only on page load"],"correct":1}]},{"num":77,"title":"Browser Control: Getting and Setting the URL Another Way","questions":[{"prompt":"Which location property gives just the protocol, like \"https:\"?","options":["location.protocol","location.scheme","location.type","location.method"],"correct":0},{"prompt":"Which location property gives the path, like \"/products/shoes\"?","options":["location.path","location.pathname","location.route","location.folder"],"correct":1},{"prompt":"Which location property gives the query string, like \"?color=red\"?","options":["location.query","location.search","location.params","location.args"],"correct":1},{"prompt":"Which method navigates AND adds a new browser history entry?","options":["location.replace()","location.assign()","location.delete()","location.skip()"],"correct":1},{"prompt":"Which method navigates WITHOUT adding a history entry?","options":["location.assign()","location.replace()","location.href","None of these"],"correct":1},{"prompt":"Which location property gives the fragment after #, like \"#section2\"?","options":["location.hash","location.fragment","location.anchor","location.tag"],"correct":0}]},{"num":78,"title":"Browser Control: Forward and Reverse","questions":[{"prompt":"Which object lets JavaScript navigate back/forward history?","options":["location","history","navigator","document"],"correct":1},{"prompt":"Which method goes back one page?","options":["history.back()","history.forward()","history.previous()","history.reverse()"],"correct":0},{"prompt":"Which method goes forward one page?","options":["history.back()","history.forward()","history.next()","history.go(1) only"],"correct":1},{"prompt":"Which method jumps multiple steps at once, e.g. two pages back?","options":["history.go(-2)","history.back(2)","history.jump(-2)","history.skip(2)"],"correct":0},{"prompt":"Does history.back() work like clicking the browser's own Back button?","options":["No, completely different","Yes, functionally equivalent","Only in Chrome","Only if there's no history"],"correct":1},{"prompt":"Can a custom button on a page call history.back() when clicked?","options":["No","Yes, inside its click handler","Only if it's the browser's own button","Only using PHP"],"correct":1}]},{"num":79,"title":"Browser Control: Filling the Window with Content","questions":[{"prompt":"Which method opens a new browser window or tab?","options":["window.new()","window.open()","window.create()","document.open()"],"correct":1},{"prompt":"What does window.open() return?","options":["Nothing","A reference to the new window","A Boolean","The current window"],"correct":1},{"prompt":"Which method writes HTML content directly into a window's document?","options":["window.write()","document.write()","window.print()","document.insert()"],"correct":1},{"prompt":"Given <code>let w=window.open(\"\",\"_blank\"); w.document.write(\"&lt;h1&gt;Hi&lt;/h1&gt;\");</code>, what happens?","options":["An error occurs","A new window opens showing an \"Hi\" heading","The current page changes","Nothing happens"],"correct":1},{"prompt":"What does an empty string as window.open()'s first argument typically mean?","options":["Open a blank window with no URL loaded yet","It causes an error","It closes the window","It opens the current page again"],"correct":0},{"prompt":"Why might document.write() be considered old-fashioned today?","options":["It's the modern standard","Modern DOM methods like createElement() are generally preferred","It only works in Internet Explorer","It's not supported anywhere"],"correct":1}]},{"num":80,"title":"Browser Control: Controlling the Window's Size and Location","questions":[{"prompt":"Which part of window.open() controls a new window's size and position?","options":["The URL argument","The features string, e.g. \"width=400,height=300\"","The target argument only","There's no way to control this"],"correct":1},{"prompt":"Which method resizes an ALREADY open window?","options":["resizeTo()","resize()","setSize()","window.size()"],"correct":0},{"prompt":"Which method moves an already open window to a new screen position?","options":["moveTo()","position()","relocate()","window.move()"],"correct":0},{"prompt":"In <code>window.open(\"info.html\",\"_blank\",\"width=400,height=300,left=100,top=100\");</code>, what do left/top control?","options":["The window's size","The window's position on screen","The window's title","Nothing, they're ignored"],"correct":1},{"prompt":"Can you both resize AND move a popup after it's opened?","options":["No, only one or the other","Yes, with resizeTo() and moveTo()","Only when it's first created","Only using CSS"],"correct":1},{"prompt":"Does the features string in window.open() use commas to separate options?","options":["No, semicolons","Yes, comma-separated key=value pairs","Spaces only","Pipes (|)"],"correct":1}]},{"num":81,"title":"Browser Control: Testing for Popup Blockers","questions":[{"prompt":"What does window.open() typically return if a popup blocker stops it?","options":["A working window reference anyway","null (or an unusable object)","An error is always thrown","The current window"],"correct":1},{"prompt":"Why check the result of window.open() before using it?","options":["You never need to","To detect whether the popup was blocked and inform the user","It's required syntax","To make the popup open faster"],"correct":1},{"prompt":"Given <code>let popup=window.open(...); if(!popup){...}</code>, what is this checking?","options":["Whether the popup was blocked","Whether the user clicked a button","Whether the page has loaded","Whether JavaScript is enabled"],"correct":0},{"prompt":"What's a user-friendly response when a popup is detected as blocked?","options":["Silently do nothing","Show a message asking the visitor to allow popups","Crash the script","Reload the page repeatedly"],"correct":1},{"prompt":"Can popup blocking behavior vary between browsers?","options":["No, it's identical everywhere","Yes, different browsers/extensions can behave differently","Only Internet Explorer blocks popups","Popups can never be blocked"],"correct":1},{"prompt":"Checking <code>typeof popup.closed === \"undefined\"</code> is a technique for:","options":["Detecting a likely popup-blocked window","Closing the popup","Resizing the popup","Redirecting the popup"],"correct":0}]}]},{"title":"Part 16 — Form Validation","topics":[{"num":82,"title":"Form Validation: Text Fields","questions":[{"prompt":"What's a basic check for a required text field?","options":["Whether it's exactly 10 characters","Whether it was left empty","Whether it contains numbers","Whether it's a valid URL"],"correct":1},{"prompt":"Why use .trim() when validating text input?","options":["To make the text uppercase","To strip leading/trailing spaces so blank-looking input doesn't pass","To count characters","To convert to a number"],"correct":1},{"prompt":"Given <code>let name=field.value.trim(); if(name===\"\"){...}</code>, what is being checked?","options":["Whether name has exactly one word","Whether the field (after trimming spaces) is empty","Whether name is a number","Whether name is too long"],"correct":1},{"prompt":"How would you validate a username needs at least 3 characters?","options":["if (username.length &lt; 3) { show error }","if (username === 3) { show error }","if (username.length &gt; 3) { show error }","It's not possible to check length"],"correct":0},{"prompt":"When should text field validation typically run?","options":["Only single radio's .checked to validate the whole group?","options":["You can, that's exactly right","You need to check the WHOLE named group to see if ANY is selected","Radio buttons don't have .checked","Radio buttons validate themselves"],"correct":1},{"prompt":"Which method retrieves all radio buttons sharing the same name attribute?","options":["document.getElementsByName()","document.getElementByRadio()","document.querySelector() only","document.radios()"],"correct":0},{"prompt":"Given a loop checking <code>if(options[i].checked)</code>, what is being tested?","options":["Whether that specific radio button is selected","Whether the radio button exists","Whether the page has loaded","Whether options[i] is visible"],"correct":0},{"prompt":"What does the shared name attribute do for a group of radio buttons?","options":["Nothing important","It groups them so only one can be selected at a time","It sets their color","It's required only for checkboxes"],"correct":1},{"prompt":"If NONE of the radios are checked after looping, what should validation do?","options":["Submit the form anyway","Show an error asking the user to choose an option","Automatically check the first one","Delete the radio buttons"],"correct":1},{"prompt":"Can a \"picked\" flag variable track whether any radio was selected?","options":["No","Yes, set true inside the loop when a checked one is found","Only for checkboxes","Only with jQuery"],"correct":1}]},{"num":85,"title":"Form Validation: ZIP Codes","questions":[{"prompt":"What is a regular expression (regex) used for?","options":["Storing numbers","Describing a text pattern to match against","Looping through arrays","Declaring variables"],"correct":1},{"prompt":"What does <code>/^\\d{5}$/</code> mean as a pattern?","options":["At least 5 digits anywhere in the string","Exactly 5 digits, start to end","Exactly 5 letters","5 or more characters of any kind"],"correct":1},{"prompt":"Which method tests a string against a regex, returning true/false?","options":[".match()",".test()",".exec()",".compare()"],"correct":1},{"prompt":"Given <code>let zipPattern=/^\\d{5}$/; zipPattern.test(\"1234\");</code>, what does this return?","options":["true","false (only 4 digits, not 5)","\"1234\"","An error"],"correct":1},{"prompt":"Which pattern would accept the extended ZIP+4 format like \"12345-6789\"?","options":["/^\\d{5}$/","/^\\d{5}(-\\d{4})?$/","/^\\d{9}$/","/^\\d{4}-\\d{5}$/"],"correct":1},{"prompt":"Why is regex useful instead of just checking .length for ZIP codes?","options":["It's not useful, length checking is enough","It confirms the exact character pattern (all digits), not just count","Regex is required by all browsers","Length checks don't work on strings"],"correct":1}]},{"num":86,"title":"Form Validation: Email","questions":[{"prompt":"What is a common shape a basic email regex checks for?","options":["Any text with no spaces","text@text.text","Only numbers","A URL format"],"correct":1},{"prompt":"Does a simple email regex catch every possible invalid email address?","options":["Yes, it's foolproof","No, it filters obvious mistakes but isn't perfect","It only checks for uppercase letters","It checks the mail server directly"],"correct":1},{"prompt":"In the pattern <code>/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/</code>, what does <code>[^\\s@]+</code> generally mean?","options":["One or more characters that are NOT whitespace or @","Exactly one character","Any digit","Nothing, it's invalid regex"],"correct":0},{"prompt":"Why should email validation also happen on the server, not just in JavaScript?","options":["JavaScript validation is always wrong","Client-side JS can be bypassed, so server checks add real security","Servers can't validate emails","It's not necessary to validate twice"],"correct":1},{"prompt":"What would a basic email regex likely flag as invalid?","options":["\"user@site.com\"","\"not-an-email\"","\"a.b@c.org\"","\"test123@domain.net\""],"correct":1},{"prompt":"Which method call tests an email string against a pattern?","options":["emailPattern.test(email)","email.pattern(emailPattern)","test(emailPattern, email)","emailPattern.check(email)"],"correct":0}]}]},{"title":"Part 17 — Exceptions and Event Handling","topics":[{"num":87,"title":"Exceptions: try and catch","questions":[{"prompt":"What does code inside a try block do?","options":["Runs only if an error already occurred","Runs normally; if it throws, control jumps to catch","Never runs","Deletes the catch block"],"correct":1},{"prompt":"When does the catch block run?","options":["Always, right after try","Only when code in try throws an error","Before try runs","Only on page load"],"correct":1},{"prompt":"Given <code>try{JSON.parse(\"bad json\");}catch(error){alert(error.message);}</code>, what happens?","options":["The script crashes entirely","The error is caught and its message is alerted","Nothing happens","JSON.parse fixes the bad JSON automatically"],"correct":1},{"prompt":"What does the parameter inside catch(error) represent?","options":["The original good data","An object describing what went wrong","A Boolean","The try block's return value"],"correct":1},{"prompt":"Why use try/catch around risky operations?","options":["To make code run faster","To handle errors gracefully instead of crashing the script","It's required for every function","To skip validation"],"correct":1},{"prompt":"Can code after a caught error continue running normally?","options":["No, the whole script always stops","Yes, once caught, execution continues normally","Only if you restart the browser","Only inside loops"],"correct":1}]},{"num":88,"title":"Exceptions: throw","questions":[{"prompt":"What does the throw keyword do?","options":["Deletes a variable","Raises a custom error on purpose","Ends a loop","Starts a new function"],"correct":1},{"prompt":"Given <code>throw new Error(\"Age cannot be negative\");</code>, what is created and thrown?","options":["A string","An Error object with that message","A number","Nothing,  and function reference used originally","Nothing, it removes all listeners","The element's id only"],"correct":1},{"prompt":"Can multiple different functions be attached to the same event on the same element?","options":["No, only one handler per event","Yes, addEventListener() supports multiple handlers","Only with inline attributes","Only for click events"],"correct":1},{"prompt":"What is passed automatically into most event handler functions?","options":["Nothing","An event object with details about what happened","The whole HTML document as text","A random number"],"correct":1}]}]}];

<script>
(function(){
  "use strict";

  var app = document.getElementById('app');

  /* ---------------- helpers ---------------- */
  function el(html){
    var t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function flattenAll(){
    var all = [];
    QUIZ_DATA.forEach(function(part){
      part.topics.forEach(function(topic){
        topic.questions.forEach(function(q){
          all.push({ prompt:q.prompt, options:q.options, correct:q.correct,
            topicNum:topic.num, topicTitle:topic.title, partTitle:part.title });
        });
      });
    });
    return all;
  }
  function shuffleQuestion(q){
    var idxs = [0,1,2,3];
    idxs = shuffle(idxs);
    var options = idxs.map(function(i){ return q.options[i]; });
    var correct = idxs.indexOf(q.correct);
    return { prompt:q.prompt, options:options, correct:correct,
      topicNum:q.topicNum, topicTitle:q.topicTitle, partTitle:q.partTitle };
  }
  function totalQuestions(){
    var n = 0;
    QUIZ_DATA.forEach(function(p){ p.topics.forEach(function(t){ n += t.questions.length; }); });
    return n;
  }
  function totalTopics(){
    var n = 0; QUIZ_DATA.forEach(function(p){ n += p.topics.length; }); return n;
  }

  /* ---------------- admin & storage config ---------------- */
  var ADMIN_EMAIL = 'fazalurrehmank@gmail.com';
  var ADMIN_PASSWORD = 'karachi123';
  var PASS_THRESHOLD = 50; // percent needed to pass a quiz
  var QUIZ_DURATION_MS = 30 * 60 * 1000; // 30 minute time limit per quiz
  var quizTimerHandle = null;
  var STORAGE_STUDENT = 'jsquiz_student_profile';
  var STORAGE_RESULTS = 'jsquiz_results';

  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }
  function loadStudent(){ return loadJSON(STORAGE_STUDENT, null); }
  function saveStudent(profile){ saveJSON(STORAGE_STUDENT, profile); }
  function clearStudent(){ try{ localStorage.removeItem(STORAGE_STUDENT); }catch(e){} }
  function loadResults(){ return loadJSON(STORAGE_RESULTS, []); }
  function saveResultRecord(record){
    var all = loadResults();
    all.push(record);
    saveJSON(STORAGE_RESULTS, all);
  }

  /* ---------------- state ---------------- */
  var state = {
    screen: 'home',
    homeFilter: '',
    openParts: {},
    session: null, // {title, source(part/topic/random), questions:[shuffled], index, score, log:[]}
    student: loadStudent(), // {name, fatherName, school, phone} or null
    pendingQuiz: null, // {questions, title} waiting on student info before starting
    adminAuthed: false,
    adminError: '',
    adminSearch: ''
  };

  /* ---------------- session control ---------------- */
  function formatTime(ms){
    var totalSec = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(totalSec / 60);
    var sec = totalSec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function clearQuizTimer(){
    if (quizTimerHandle){ clearInterval(quizTimerHandle); quizTimerHandle = null; }
  }
  function startQuizTimer(){
    clearQuizTimer();
    quizTimerHandle = setInterval(function(){
      var s = state.session;
      if (!s || state.screen !== 'quiz'){ clearQuizTimer(); return; }
      var remaining = s.endTime - Date.now();
      var el = document.getElementById('quizTimer');
      if (el){
        el.textContent = formatTime(remaining);
        el.classList.toggle('low', remaining <= 60000);
      }
      if (remaining <= 0){
        clearQuizTimer();
        finishQuiz();
      }
    }, 1000);
  }
  function startSession(rawQuestions, title){
    var qs = rawQuestions.map(shuffleQuestion);
    state.session = { title: title, questions: qs, index: 0, score: 0, log: [], answered: false, chosen: null, endTime: Date.now() + QUIZ_DURATION_MS, saved: false };
    state.screen = 'quiz';
    render();
    startQuizTimer();
  }
  function retrySession(){
    if (!state.session) return;
    clearQuizTimer();
    var base = state.session.questions.map(function(q){
      // reconstruct original-ish shape then reshuffle again for a fresh attempt
      return { prompt:q.prompt, options:q.options, correct:q.correct,
        topicNum:q.topicNum, topicTitle:q.topicTitle, partTitle:q.partTitle };
    });
    startSession(base, state.session.title);
  }
  function goHome(){
    clearQuizTimer();
    state.screen = 'home';
    state.session = null;
    render();
  }

  /* ---------------- student gate ---------------- */
  function chooseQuiz(rawQuestions, title){
    if (state.student){
      startSession(rawQuestions, title);
    } else {
      state.pendingQuiz = { questions: rawQuestions, title: title };
      state.screen = 'studentInfo';
      render();
    }
  }
  function submitStudentInfo(){
    var nameEl = document.getElementById('stuName');
    var fatherEl = document.getElementById('stuFather');
    var schoolEl = document.getElementById('stuSchool');
    var phoneEl = document.getElementById('stuPhone');
    var name = nameEl ? nameEl.value.trim() : '';
    var father = fatherEl ? fatherEl.value.trim() : '';
    var school = schoolEl ? schoolEl.value.trim() : '';
    var phone = phoneEl ? phoneEl.value.trim() : '';
    var errEl = document.getElementById('stuError');
    if (!name || !father || !school || !phone){
      if (errEl) errEl.textContent = 'Please fill in all fields.';
      return;
    }
    if (!/^\d{11}$/.test(phone)){
      if (errEl) errEl.textContent = 'Phone number must be exactly 11 digits (numbers only).';
      return;
    }
    var profile = { name: name, fatherName: father, school: school, phone: phone };
    saveStudent(profile);
    state.student = profile;
    var pending = state.pendingQuiz;
    state.pendingQuiz = null;
    if (pending){
      startSession(pending.questions, pending.title);
    } else {
      state.screen = 'home';
      render();
    }
  }
  function switchStudent(){
    clearStudent();
    state.student = null;
    state.session = null;
    state.screen = 'home';
    render();
  }

  /* ---------------- admin ---------------- */
  function goAdminLogin(){
    state.adminError = '';
    state.screen = 'adminLogin';
    render();
  }
  function submitAdminLogin(){
    var emailEl = document.getElementById('adminEmail');
    var passEl = document.getElementById('adminPassword');
    var email = emailEl ? emailEl.value.trim() : '';
    var pass = passEl ? passEl.value : '';
    if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase() && pass === ADMIN_PASSWORD){
      state.adminAuthed = true;
      state.adminError = '';
      state.adminSearch = '';
      state.screen = 'admin';
      render();
    } else {
      state.adminError = 'Incorrect email or password.';
      render();
    }
  }
  function adminLogout(){
    state.adminAuthed = false;
    state.screen = 'home';
    render();
  }

  function chooseTopic(part, topic){
    chooseQuiz(topic.questions.map(function(q){
      return Object.assign({}, q, { topicNum:topic.num, topicTitle:topic.title, partTitle:part.title });
    }), topic.num + '. ' + topic.title);
  }
  function choosePart(part){
    var qs = [];
    part.topics.forEach(function(topic){
      topic.questions.forEach(function(q){
        qs.push(Object.assign({}, q, { topicNum:topic.num, topicTitle:topic.title, partTitle:part.title }));
      });
    });
    chooseQuiz(qs, part.title);
  }
  function chooseRandom(n){
    var all = flattenAll();
    var pick = shuffle(all).slice(0, Math.min(n, all.length));
    chooseQuiz(pick, 'Random Mix \u00b7 ' + pick.length + ' questions');
  }

  function selectOption(i){
    var s = state.session;
    if (!s || s.answered) return;
    var q = s.questions[s.index];
    s.answered = true;
    s.chosen = i;
    var correct = (i === q.correct);
    if (correct) s.score++;
    s.log.push({ q:q, chosen:i, correct:correct });
    renderQuizAnswered();
  }
  function nextQuestion(){
    var s = state.session;
    if (!s) return;
    if (s.index < s.questions.length - 1){
      s.index++;
      s.answered = false;
      s.chosen = null;
      render();
    } else {
      finishQuiz();
    }
  }
  function finishQuiz(){
    var s = state.session;
    if (!s) return;
    clearQuizTimer();
    state.screen = 'results';
    if (!s.saved){
      s.saved = true;
      var pct = Math.round(s.score / s.questions.length * 100);
      saveResultRecord({
        name: state.student ? state.student.name : '',
        fatherName: state.student ? state.student.fatherName : '',
        school: state.student ? state.student.school : '',
        phone: state.student ? state.student.phone : '',
        quizTitle: s.title,
        score: s.score,
        total: s.questions.length,
        percent: pct,
        passed: pct >= PASS_THRESHOLD,
        date: new Date().toISOString()
      });
    }
    render();
  }

  /* ---------------- render: HOME ---------------- */
  function letterOf(i){ return ['A','B','C','D'][i]; }

  function renderHome(){
    var qTotal = totalQuestions(), tTotal = totalTopics(), pTotal = QUIZ_DATA.length;
    var filter = state.homeFilter.trim().toLowerCase();

    var partsHtml = QUIZ_DATA.map(function(part, pi){
      var topics = part.topics;
      var matchedTopics = topics;
      var isFilterActive = filter.length > 0;
      var partMatches = part.title.toLowerCase().indexOf(filter) !== -1;
      if (isFilterActive){
        matchedTopics = topics.filter(function(t){
          return t.title.toLowerCase().indexOf(filter) !== -1 ||
                 (part.title.toLowerCase().indexOf(filter) !== -1) ||
                 String(t.num) === filter;
        });
        if (matchedTopics.length === 0 && !partMatches) return '';
        if (partMatches && matchedTopics.length === 0) matchedTopics = topics;
      }
      var isOpen = isFilterActive ? true : !!state.openParts[pi];
      var qCount = topics.reduce(function(a,t){ return a + t.questions.length; }, 0);
      var topicsHtml = matchedTopics.map(function(t){
        return '<button class="topic-row" data-action="topic" data-part="'+pi+'" data-topic="'+t.num+'">' +
          '<span class="topic-num">'+String(t.num).padStart(2,'0')+'</span>' +
          '<span class="topic-name">'+escapeHtml(t.title)+'</span>' +
          '<span class="topic-qcount">'+t.questions.length+'Q</span>' +
          '</button>';
      }).join('');
      return '<div class="part'+(isOpen?' open':'')+'" data-part-wrap="'+pi+'">' +
        '<button class="part-head" data-action="toggle-part" data-part="'+pi+'">' +
          '<span class="part-num">'+(pi+1)+'</span>' +
          '<span class="part-title">'+escapeHtml(part.title.replace(/^Part \d+\s*\u2014\s*/, ''))+'</span>' +
          '<span class="part-meta">'+topics.length+' topics \u00b7 '+qCount+'Q</span>' +
          '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>' +
        '</button>' +
        '<div class="part-topics">' +
          '<button class="part-quiz-all" data-action="part-quiz" data-part="'+pi+'">Quiz all '+qCount+' questions in this part</button>' +
          topicsHtml +
        '</div>' +
      '</div>';
    }).join('');

    var noResults = filter && partsHtml.trim() === '' ? '<div class="empty">No topics match \u201c'+escapeHtml(state.homeFilter)+'\u201d.</div>' : '';

    app.innerHTML =
      '<div class="topbar">' +
        '<div class="brand"><b>Fazal K </b> -quiz<span class="cursor"></span></div>' +
        '<div class="spacer"></div>' +
        '<button class="icon-btn" data-action="admin-login" aria-label="Admin">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="hero">' +
        '<h1>Test what you know.</h1>' +
        '<p>Multiple-choice practice for every JavaScript fundamental \u2014 pick a topic, a whole part, or a random mix.</p>' +
        '<div class="stat-row">' +
          '<div class="stat"><b>'+qTotal+'</b><span>questions</span></div>' +
          '<div class="stat"><b>'+tTotal+'</b><span>topics</span></div>' +
          '<div class="stat"><b>'+pTotal+'</b><span>parts</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="section">' +
        '<div class="section-head"><h2>Quick practice</h2></div>' +
        '<div class="chip-row">' +
          '<button class="chip" data-action="random" data-n="10"><span class="n">10</span> random</button>' +
          '<button class="chip" data-action="random" data-n="20"><span class="n">20</span> random</button>' +
          '<button class="chip" data-action="random" data-n="50"><span class="n">50</span> random</button>' +
        '</div>' +
      '</div>' +
      '<div class="search-wrap">' +
        '<div class="search-box">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
          '<input id="topicSearch" type="text" inputmode="search" placeholder="Find a topic\u2026" value="'+escapeAttr(state.homeFilter)+'" />' +
        '</div>' +
      '</div>' +
      '<div class="section" style="padding-top:8px;">' +
        '<div class="section-head"><h2>Practice by part</h2></div>' +
        partsHtml + noResults +
      '</div>';

    var searchInput = document.getElementById('topicSearch');
    if (searchInput){
      searchInput.addEventListener('input', function(e){
        state.homeFilter = e.target.value;
        var pos = e.target.selectionStart;
        renderHome();
        var again = document.getElementById('topicSearch');
        if (again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(err){} }
      });
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }

  /* ---------------- render: QUIZ ---------------- */
  function renderQuiz(){
    var s = state.session;
    var q = s.questions[s.index];
    var pct = Math.round((s.index) / s.questions.length * 100);

    var optionsHtml = q.options.map(function(opt, i){
      return '<button class="option" data-action="answer" data-i="'+i+'">' +
        '<span class="letter">'+letterOf(i)+'</span>' +
        '<span class="otext">'+opt+'</span>' +
      '</button>';
    }).join('');

    var remaining = s.endTime ? (s.endTime - Date.now()) : QUIZ_DURATION_MS;

    app.innerHTML =
      '<div class="topbar">' +
        '<button class="icon-btn" data-action="home" aria-label="Back to topics">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>' +
        '</button>' +
        '<div class="brand"><b>Fazal K</b>-quiz<span class="cursor"></span></div>' +
      '</div>' +
      '<div class="quiz-meta">' +
        '<div class="quiz-crumb"><span>'+escapeHtml(s.title)+'</span><span class="timer'+(remaining<=60000?' low':'')+'" id="quizTimer">'+formatTime(remaining)+'</span><span class="score">'+s.score+'/'+s.index+'</span></div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>' +
        '<div class="q-count">Question '+(s.index+1)+' of '+s.questions.length+'</div>' +
      '</div>' +
      '<div class="q-wrap">' +
        '<div class="q-card"><div class="q-prompt">'+q.prompt+'</div></div>' +
        '<div class="options">'+optionsHtml+'</div>' +
      '</div>' +
      '<div class="feedback-bar" id="fbar"></div>';
  }

  function renderQuizAnswered(){
    var s = state.session;
    var q = s.questions[s.index];
    var opts = app.querySelectorAll('.option');
    opts.forEach(function(btn, i){
      btn.setAttribute('disabled', 'true');
      if (i === q.correct) btn.classList.add('is-correct');
      else if (i === s.chosen) btn.classList.add('is-wrong');
      else btn.classList.add('is-muted');
      if (i === q.correct){
        btn.insertAdjacentHTML('beforeend', '<span class="mark">\u2713</span>');
      } else if (i === s.chosen){
        btn.insertAdjacentHTML('beforeend', '<span class="mark">\u2715</span>');
      }
    });
    var correct = (s.chosen === q.correct);
    var isLast = s.index === s.questions.length - 1;
    var fbar = document.getElementById('fbar');
    fbar.innerHTML =
      '<div class="feedback-text '+(correct?'good':'bad')+'">' +
        (correct ? 'Correct.' : 'Not quite.') +
        (correct ? '' : '<small>Correct answer: '+letterOf(q.correct)+') '+stripTags(q.options[q.correct])+'</small>') +
      '</div>' +
      '<button class="btn btn-primary" data-action="next">'+(isLast ? 'See results' : 'Continue')+'</button>';
    requestAnimationFrame(function(){ fbar.classList.add('show'); });
    // update running score in crumb
    var scoreEl = app.querySelector('.quiz-crumb .score');
    if (scoreEl) scoreEl.textContent = s.score + '/' + (s.index+1);
  }

  function stripTags(html){
    var d = document.createElement('div');
    d.innerHTML = html;
    return d.textContent;
  }

  /* ---------------- render: RESULTS ---------------- */
  function renderResults(){
    var s = state.session;
    var total = s.questions.length;
    var pct = Math.round(s.score / total * 100);
    var msg, sub;
    if (pct >= 90){ msg = 'Excellent work.'; sub = 'That\u2019s a strong grip on this material.'; }
    else if (pct >= 70){ msg = 'Solid result.'; sub = 'A little more review and this is locked in.'; }
    else if (pct >= 50){ msg = 'Halfway there.'; sub = 'Worth another pass through this set.'; }
    else { msg = 'Room to grow.'; sub = 'Revisit the course guide, then try again.'; }

    var reviewHtml = s.log.map(function(item){
      var q = item.q;
      var cls = item.correct ? 'correct' : 'wrong';
      var mk = item.correct ? '\u2713' : '\u2717';
      var ansLine = item.correct
        ? ''
        : '<div class="ans">Your answer: '+letterOf(item.chosen)+') '+stripTags(q.options[item.chosen])+' &nbsp;\u00b7&nbsp; <b class="good">Correct: '+letterOf(q.correct)+') '+stripTags(q.options[q.correct])+'</b></div>';
      return '<div class="review-item '+cls+'"><span class="mk">'+mk+'</span>' +
        '<div class="body"><div class="prompt">'+q.prompt+'</div>'+ansLine+'</div></div>';
    }).join('');

    app.innerHTML =
      '<div class="topbar">' +
        '<button class="icon-btn" data-action="home" aria-label="Back to topics">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>' +
        '</button>' +
        '<div class="brand"><b>Fazal K</b>-quiz<span class="cursor"></span></div>' +
      '</div>' +
      '<div class="results-wrap">' +
        '<div class="score-card">' +
          '<div class="score-big">'+s.score+'<span style="color:var(--text-faint)">/'+total+'</span> <span class="score-pct">('+pct+'%)</span></div>' +
          '<div class="score-label">'+escapeHtml(s.title)+'</div>' +
          (state.student ? '<div class="score-label">'+escapeHtml(state.student.name)+' \u00b7 '+escapeHtml(state.student.school)+'</div>' : '') +
          '<div style="margin-top:10px;"><span class="badge '+(pct>=PASS_THRESHOLD?'pass':'fail')+'">'+(pct>=PASS_THRESHOLD?'PASS':'FAIL')+'</span></div>' +
          '<div class="score-msg">'+msg+'</div>' +
          '<div class="score-sub">'+sub+'</div>' +
        '</div>' +
        '<div class="results-actions">' +
          '<button class="btn btn-primary btn-block" data-action="retry">Try again</button>' +
          '<button class="btn btn-ghost btn-block" data-action="home">Back to topics</button>' +
        '</div>' +
        (state.student ? '<div style="text-align:center;margin-bottom:18px;"><button class="link-btn" data-action="switch-student">Not '+escapeHtml(state.student.name)+'? Switch student</button></div>' : '') +
        '<div class="section-head"><h2>Review</h2></div>' +
        '<div class="review">'+reviewHtml+'</div>' +
      '</div>';
  }

  /* ---------------- render: STUDENT INFO ---------------- */
  function renderStudentInfo(){
    app.innerHTML =
      '<div class="topbar">' +
        '<button class="icon-btn" data-action="home" aria-label="Back to topics">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>' +
        '</button>' +
        '<div class="brand"><b>Fazal K</b>-quiz<span class="cursor"></span></div>' +
      '</div>' +
      '<div class="form-wrap">' +
        '<div class="form-card">' +
          '<h2>Before you start</h2>' +
          '<p class="sub">Enter your details so your quiz result can be recorded and shared with your teacher.</p>' +
          '<div class="field"><label>Full Name</label><input id="stuName" type="text" placeholder="e.g. Khadija" /></div>' +
          '<div class="field"><label>Father\u2019s Name</label><input id="stuFather" type="text" placeholder="e.g. Khan" /></div>' +
          '<div class="field"><label>School Name</label><input id="stuSchool" type="text" placeholder="e.g. City Grammar School" /></div>' +
          '<div class="field"><label>Phone Number (11 digits)</label><input id="stuPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="e.g. 03001234567" /></div>' +
          '<div class="form-error" id="stuError"></div>' +
          '<button class="btn btn-primary btn-block" data-action="submit-student">Start Quiz</button>' +
        '</div>' +
      '</div>';
    var phoneEl = document.getElementById('stuPhone');
    if (phoneEl){
      phoneEl.addEventListener('input', function(e){
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11);
      });
    }
  }

  /* ---------------- render: ADMIN LOGIN ---------------- */
  function renderAdminLogin(){
    app.innerHTML =
      '<div class="topbar">' +
        '<button class="icon-btn" data-action="home" aria-label="Back to topics">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>' +
        '</button>' +
        '<div class="brand"><b>Fazal K</b>-quiz<span class="cursor"></span></div>' +
      '</div>' +
      '<div class="form-wrap">' +
        '<div class="form-card">' +
          '<h2>Admin Login</h2>' +
          '<p class="sub">Sign in to view every student\u2019s quiz results.</p>' +
          '<div class="field"><label>Email</label><input id="adminEmail" type="email" placeholder="admin@example.com" /></div>' +
          '<div class="field"><label>Password</label><input id="adminPassword" type="password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022" /></div>' +
          '<div class="form-error">'+(state.adminError ? escapeHtml(state.adminError) : '')+'</div>' +
          '<button class="btn btn-primary btn-block" data-action="admin-submit">Log in</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- render: ADMIN DASHBOARD ---------------- */
  function renderAdmin(){
    var all = loadResults();
    var filter = (state.adminSearch || '').trim().toLowerCase();
    var filtered = all.filter(function(r){
      if (!filter) return true;
      return (r.name||'').toLowerCase().indexOf(filter)!==-1 ||
             (r.school||'').toLowerCase().indexOf(filter)!==-1 ||
             (r.phone||'').toLowerCase().indexOf(filter)!==-1 ||
             (r.quizTitle||'').toLowerCase().indexOf(filter)!==-1 ||
             (r.fatherName||'').toLowerCase().indexOf(filter)!==-1;
    }).slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); });

    var totalAttempts = all.length;
    var passCount = all.filter(function(r){ return r.passed; }).length;

    var rowsHtml = filtered.map(function(r){
      var d = new Date(r.date);
      var dateStr = isNaN(d.getTime()) ? '' : (d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
      return '<div class="admin-row">' +
        '<div class="top">' +
          '<span class="name">'+escapeHtml(r.name||'(no name)')+'</span>' +
          '<span class="badge '+(r.passed?'pass':'fail')+'">'+(r.passed?'PASS':'FAIL')+'</span>' +
        '</div>' +
        '<div class="meta">Father: '+escapeHtml(r.fatherName||'-')+' &nbsp;\u00b7&nbsp; School: '+escapeHtml(r.school||'-')+'</div>' +
        '<div class="meta">Phone: '+escapeHtml(r.phone||'-')+'</div>' +
        '<div class="quiz"><b>Quiz:</b> '+escapeHtml(r.quizTitle||'')+' \u2014 '+r.score+'/'+r.total+' ('+r.percent+'%)</div>' +
        '<div class="meta">'+dateStr+'</div>' +
      '</div>';
    }).join('');

    var emptyHtml = filtered.length===0 ? '<div class="empty">No results yet.</div>' : '';

    app.innerHTML =
      '<div class="topbar">' +
        '<div class="brand"><b>Fazal K</b>-quiz<span class="cursor"></span></div>' +
        '<div class="spacer"></div>' +
        '<button class="icon-btn" data-action="admin-logout" aria-label="Log out">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="hero">' +
        '<h1>Admin Dashboard</h1>' +
        '<p>Every student\u2019s quiz attempts, with father\u2019s name, school, phone number, which quiz they took, and pass/fail status.</p>' +
        '<div class="stat-row">' +
          '<div class="stat"><b>'+totalAttempts+'</b><span>attempts</span></div>' +
          '<div class="stat"><b>'+passCount+'</b><span>passed</span></div>' +
          '<div class="stat"><b>'+(totalAttempts-passCount)+'</b><span>failed</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="search-wrap">' +
        '<div class="search-box">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>' +
          '<input id="adminSearch" type="text" placeholder="Search by name, school, phone or quiz\u2026" value="'+escapeAttr(state.adminSearch||'')+'" />' +
        '</div>' +
      '</div>' +
      '<div class="section" style="padding-top:8px;">' +
        rowsHtml + emptyHtml +
      '</div>';

    var searchInput = document.getElementById('adminSearch');
    if (searchInput){
      searchInput.addEventListener('input', function(e){
        state.adminSearch = e.target.value;
        var pos = e.target.selectionStart;
        renderAdmin();
        var again = document.getElementById('adminSearch');
        if (again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(err){} }
      });
    }
  }

  /* ---------------- master render ---------------- */
  function render(){
    if (state.screen === 'home') renderHome();
    else if (state.screen === 'studentInfo') renderStudentInfo();
    else if (state.screen === 'quiz') renderQuiz();
    else if (state.screen === 'results') renderResults();
    else if (state.screen === 'adminLogin') renderAdminLogin();
    else if (state.screen === 'admin') renderAdmin();
    window.scrollTo(0,0);
  }

  /* ---------------- event delegation ---------------- */
  app.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var action = t.getAttribute('data-action');
    if (action === 'toggle-part'){
      var pi = t.getAttribute('data-part');
      state.openParts[pi] = !state.openParts[pi];
      renderHome();
    } else if (action === 'topic'){
      var pi2 = parseInt(t.getAttribute('data-part'), 10);
      var tnum = parseInt(t.getAttribute('data-topic'), 10);
      var part = QUIZ_DATA[pi2];
      var topic = part.topics.filter(function(x){ return x.num === tnum; })[0];
      chooseTopic(part, topic);
    } else if (action === 'part-quiz'){
      var pi3 = parseInt(t.getAttribute('data-part'), 10);
      choosePart(QUIZ_DATA[pi3]);
    } else if (action === 'random'){
      chooseRandom(parseInt(t.getAttribute('data-n'), 10));
    } else if (action === 'answer'){
      selectOption(parseInt(t.getAttribute('data-i'), 10));
    } else if (action === 'next'){
      nextQuestion();
    } else if (action === 'retry'){
      retrySession();
    } else if (action === 'home'){
      goHome();
    } else if (action === 'submit-student'){
      submitStudentInfo();
    } else if (action === 'switch-student'){
      switchStudent();
    } else if (action === 'admin-login'){
      goAdminLogin();
    } else if (action === 'admin-submit'){
      submitAdminLogin();
    } else if (action === 'admin-logout'){
      adminLogout();
    }
  });

  render();
})();

</script>
</body>
</html>
